name: Benchmark catalog
on:
  pull_request:
    paths: ['Benchmarks/**', 'Tests/Reports/**', 'bench/**', 'roadmap/**', 'Scripts/*benchmarks*', 'site/**', '.github/workflows/benchmarks.yml']
  push:
    branches: [main]
    paths: ['Benchmarks/**', 'Tests/Reports/**', 'bench/**', 'roadmap/**', 'Scripts/*benchmarks*', 'site/**', '.github/workflows/benchmarks.yml']
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s Scripts -p test_benchmarks.py
      - run: python3 Scripts/benchmarks.py check
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm --prefix site test
      - run: npm --prefix site ci
      - run: npm --prefix site run lint
      - run: npm --prefix site run build
