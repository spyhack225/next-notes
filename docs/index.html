    <!-- Absolute, not relative, and not negotiable. Open Graph consumers resolve these

    <!-- Structured data, stated as a fact rather than a claim about a claim: this is a free
         macOS application. Written into the static HTML rather than injected by React,
         because the crawlers most likely to read it are the ones that never run the bundle. -->
    <script type="application/ld+json">

        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Next Notes",
        "url": "https://next-notes.com/",
        "applicationCategory": "ProductivityApplication",
        "applicationSubCategory": "Dictation and meeting notes",
        "operatingSystem": "macOS 26 or later, Apple silicon",
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "description": "Dictation and meeting notes for macOS that run entirely on your own Mac. Hold a key and speak, and the cleaned-up sentence appears at the cursor in whatever app is focused. Meetings are transcribed and summarised locally, with no bot joining the call.",

          "Push-to-talk dictation into any macOS app",
          "On-device speech recognition (Apple Speech or NVIDIA Parakeet via CoreML)",
          "On-device summarisation with a local language model",
          "Meeting recording from your calendar, with microphone and system audio as separate tracks",
          "Drafted follow-ups that you approve before anything is sent",
          "A learned dictionary of your own names and jargon"
        ],
        "softwareRequirements": "macOS 26, Apple silicon",

    <script type="module" crossorigin src="./assets/index-bfQsENWr.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-ByDF2GGH.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- The page is a client-rendered React app, so without this the document a crawler
         receives is an empty div. Search engines render JavaScript; the assistant crawlers
         this project most wants to be read by largely do not. This is the same claim the
         rendered page makes, in the markup, for readers that never execute the bundle.
         The real fix is prerendering the route at build time — this is the honest floor
         under that, not a substitute for it. -->
    <noscript>
      <h1>Next Notes — talk instead of typing, and never take notes again</h1>
      <p>
        Dictation and meeting notes for macOS that run entirely on your own Mac. Hold a key
        anywhere and speak: the cleaned-up sentence appears at the cursor, in whatever app
        you were already in. Sit in a meeting and the notes write themselves.
        Requires macOS 26 on Apple silicon. Free and open source.
      </p>
      <h2>Everything happens on the device</h2>
      <ul>
        <li>
          <strong>Transcribed here.</strong> Apple's on-device speech recogniser, or Parakeet
          through CoreML. Audio becomes words on the machine it was spoken to.
        </li>
        <li>
          <strong>Written here.</strong> A local model reads the transcript and writes the
          summary, the decisions and who owes what. Downloaded once, then offline.
        </li>
        <li>
          <strong>Stored here.</strong> One folder per meeting in Application Support.
          Recordings are deleted once the notes are written, unless you keep them.
        </li>
        <li>
          Nothing joins your call, so nobody has to agree to a stranger in the room. There is
          no server to send any of it to, and no account to create.
        </li>
      </ul>
      <p><a href="https://github.com/spyhack225/next-notes">Source and releases on GitHub</a></p>
    </noscript>
  </body>
